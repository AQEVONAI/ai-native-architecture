  - id: O-02
    name: AI Evaluation Gate
    domain: operations
    classification: S
    status: research
    version: "0.1.0"
    intent: "Require an AI capability to pass a defined evaluation threshold before a change is promoted to production."
    path: patterns/operations/O-02-ai-evaluation-gate.md
    related_patterns: [O-01, E-02, I-01]
    anti_patterns: [AP-07]
    last_reviewed: "2026-08-24"

