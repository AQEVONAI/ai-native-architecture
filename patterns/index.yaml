anti_patterns:
  - id: AP-01
    name: Agent by Default
    problem_summary: "Defaulting to agentic architecture without justifying it against simpler alternatives."
    related_patterns: [A-01, A-02, C-01]
    path: anti-patterns/AP-01-agent-by-default.md

  - id: AP-02
    name: RAG Everything
    problem_summary: "Applying retrieval-augmented generation to problems better solved by deterministic lookup or structured queries."
    related_patterns: [K-01, K-02]
    path: anti-patterns/AP-02-rag-everything.md

  - id: AP-03
    name: Prompt-as-Policy
    problem_summary: "Encoding authorization or behavioral constraints only as prompt instructions rather than enforced policy."
    related_patterns: [C-02]
    path: anti-patterns/AP-03-prompt-as-policy.md

  - id: AP-04
    name: Vector Database as Knowledge Architecture
    problem_summary: "Treating a vector index as equivalent to a governed knowledge layer."
    related_patterns: [K-02, K-03, E-01]
    path: anti-patterns/AP-04-vector-database-as-knowledge-architecture.md

  - id: AP-05
    name: Context Dumping
    problem_summary: "Appending as much context as fits into a model's window instead of deliberately curating it."
    related_patterns: [I-02, K-01, I-03]
    path: anti-patterns/AP-05-context-dumping.md

  - id: AP-06
    name: Autonomous Privilege Creep
    problem_summary: "An agent's effective authority expands over time without a corresponding, deliberate policy decision."
    related_patterns: [A-01, A-02, C-02, C-03]
    path: anti-patterns/AP-06-autonomous-privilege-creep.md

  - id: AP-07
    name: Single-Model Dependency
    problem_summary: "Architecting a system around one model provider/version with no routing, fallback, or degradation path."
    related_patterns: [I-01, O-03, O-02]
    path: anti-patterns/AP-07-single-model-dependency.md

  - id: AP-08
    name: Human-in-the-Loop Theater
    problem_summary: "A human approval step exists in name but not in practice — approvals are rubber-stamped without real ability to catch errors."
    related_patterns: [C-01, A-03, O-01]
    path: anti-patterns/AP-08-human-in-the-loop-theater.md
