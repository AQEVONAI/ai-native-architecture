    domain: operations
    classification: S/P
    status: research
    version: "0.1.0"
    intent: "Define explicit fallback behavior for an AI capability when its primary model, tool, or knowledge source is unavailable or underperforming."
    path: patterns/operations/O-03-graceful-ai-degradation.md
    related_patterns: [I-01, O-01, O-02]
    anti_patterns: [AP-07]
    last_reviewed: "2026-08-24"

  - id: E-01
    name: Knowledge Evolution Loop
    domain: evolution
    classification: S/P
    status: research
    version: "0.1.0"
    intent: "Continuously detect, evaluate, and incorporate change in the underlying Enterprise Knowledge Fabric sources."
    path: patterns/evolution/E-01-knowledge-evolution-loop.md
    related_patterns: [K-02, K-03, O-01]
    anti_patterns: [AP-04]
    last_reviewed: "2026-08-24"

  - id: E-02
    name: AI Architecture Evolution Loop
    domain: evolution
    classification: P
    status: research
    version: "0.1.0"
    intent: "Turn operational and evaluation signal into deliberate architectural change, on a recurring cycle, rather than silent drift."
    path: patterns/evolution/E-02-ai-architecture-evolution-loop.md
    related_patterns: [O-01, O-02, E-01]
    anti_patterns: []
